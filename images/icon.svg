<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="0.45" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.30" cy="0.22" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="feather" x1="0.15" y1="0.05" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6eaff"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1e1b4b" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="256" height="256" rx="52" fill="url(#bg)"/>
  <rect width="256" height="256" rx="52" fill="url(#glow)"/>

  <!-- Ink writing line: thicker and brighter so it survives downscaling -->
  <path d="M 62 212 C 100 231, 140 194, 176 212 C 196 222, 210 216, 220 205"
        fill="none" stroke="#ffffff" stroke-opacity="0.92"
        stroke-width="10" stroke-linecap="round"/>

  <g filter="url(#soft)">
    <!-- Fuller feather body -->
    <path d="
      M 214 44
      C 146 66, 88 128, 66 208
      C 138 176, 188 110, 214 44
      Z" fill="url(#feather)"/>
    <!-- Nib -->
    <path d="M 66 208 L 42 234 L 58 242 L 86 213 Z" fill="url(#feather)"/>
    <circle cx="40" cy="240" r="7.5" fill="#ffffff"/>
  </g>

  <!-- Spine: darker + thicker for contrast against the white body -->
  <path d="M 206 50 C 150 102, 106 158, 72 208"
        fill="none" stroke="#4338ca" stroke-width="5.5" stroke-linecap="round"/>

  <!-- Barbs: fewer, thicker, darker so they read at small sizes -->
  <g fill="none" stroke="#4f46e5" stroke-width="5" stroke-linecap="round" stroke-opacity="0.92">
    <path d="M 176 72 C 166 58, 154 54, 144 57"/>
    <path d="M 148 108 C 138 94, 126 90, 116 93"/>
    <path d="M 120 144 C 110 130, 98 126, 88 129"/>
    <path d="M 160 92 C 172 85, 184 88, 191 97"/>
    <path d="M 132 128 C 144 121, 156 124, 163 133"/>
  </g>
</svg>
