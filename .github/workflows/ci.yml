name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # pretest compiles the extension bundle plus the test-only parser,
      # decoration, image and formatter bundles before mocha runs
      - name: Run tests
        run: npm test

      - name: Package smoke test
        run: npx vsce package --out calliope-md.vsix

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v7
        with:
          name: calliope-md-vsix
          path: calliope-md.vsix
          retention-days: 14
