name: Publish Extension

# Manual trigger only. Publishes the version currently in package.json to the
# VS Code Marketplace (and Open VSX if OVSX_PAT is configured), but only after
# the test job passes. Bump the version and commit before dispatching.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Package only — skip publishing'
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package
        run: npx vsce package --out calliope-md.vsix

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: calliope-md-vsix
          path: calliope-md.vsix
          retention-days: 90

      - name: Publish to VS Code Marketplace
        if: ${{ !inputs.dry-run }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath calliope-md.vsix

      # Optional: publishes to Open VSX (VSCodium, Gitpod, Cursor, ...) when
      # an OVSX_PAT secret exists; silently skipped otherwise.
      - name: Publish to Open VSX
        if: ${{ !inputs.dry-run }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "OVSX_PAT secret not configured — skipping Open VSX publish."
            exit 0
          fi
          npx ovsx publish calliope-md.vsix -p "$OVSX_PAT"
