name: Publish Extension

# Manual trigger only. Publishes the version currently in package.json to the
# VS Code Marketplace and Open VSX, but only after the test job passes. Bump
# the version and commit before dispatching.
#
# Marketplace auth uses Microsoft Entra ID workload identity federation
# (OIDC) instead of a PAT, per
# https://code.visualstudio.com/api/working-with-extensions/publishing-extension#secure-automated-publishing-to-visual-studio-marketplace
# (Azure DevOps PATs are retired on December 1, 2026.)
#
# Required repository secrets:
#   AZURE_CLIENT_ID       client ID of the managed identity / app registration
#   AZURE_TENANT_ID       Entra tenant ID
#   AZURE_SUBSCRIPTION_ID Azure subscription ID
#   OVSX_PAT              Open VSX access token (Open VSX still uses PATs)
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Package only — skip publishing'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to mint the OIDC token that azure/login exchanges for an
      # Entra ID credential (workload identity federation)
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package
        run: npx vsce package --out calliope-md.vsix

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: calliope-md-vsix
          path: calliope-md.vsix
          retention-days: 90

      - name: Azure login (workload identity federation)
        if: ${{ !inputs.dry-run }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Publish to VS Code Marketplace
        if: ${{ !inputs.dry-run }}
        run: npx vsce publish --azure-credential --packagePath calliope-md.vsix

      - name: Publish to Open VSX
        if: ${{ !inputs.dry-run }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::error::OVSX_PAT secret is not configured"
            exit 1
          fi
          npx ovsx publish calliope-md.vsix -p "$OVSX_PAT"
